name: KANTOR browser smoke checks
on:
  push:
    branches: [main, ux-decision-workflow-054, decision-comparison-055]
    paths:
      - '**.js'
      - '**.css'
      - 'index.html'
      - 'data/**'
      - '.github/workflows/browser-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve repository over HTTP
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/kantor-http.log 2>&1 &
      - name: Test actual navigation and capture screenshots
        shell: bash
        run: |
          mkdir -p browser-report
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const base = 'http://127.0.0.1:8765/';
          const pages = [
            ['home12','home12',[]],
            ['group07','group07',['programs10','groups','scope04']],
            ['group07','calendar11',['source07']],
            ['space12','space12',['campus13']],
            ['space12','survey15',['routes04','priority06','campus']],
            ['scenarios','scenarios',['unified04','exact05']],
            ['baseline09','baseline09',['experiment06','audit']],
            ['baseline09','review08',['review05','source1']],
            ['overview','overview',['schedule','checks']],
            ['overview','optimize',['data','method']]
          ];
          (async () => {
            const browser = await chromium.launch();
            const findings = [];
            try {
              // Live bundle / IndexedDB fallback contract, without contacting the university.
              const manifest=JSON.parse(fs.readFileSync('data/calendar-11/manifest.json','utf8'));
              const files=manifest.groups.map(g=>JSON.parse(fs.readFileSync('data/calendar-11/'+g.file,'utf8')));
              const fixture={version:'0.27',manifest,files,period:{start:'2026-11-23',end:'2026-12-06'}};
              const liveContext=await browser.newContext();
              try {
                const live=await liveContext.newPage();
                let responseMode='valid';
                await live.route('**/*',route=>{
                  const url=route.request().url();
                  if(url.startsWith(base))return route.continue();
                  if(url==='https://raw.githubusercontent.com/Strelkov23/kantor/main/data/current/calendar.json'){
                    if(responseMode==='offline')return route.abort();
                    const body=responseMode==='invalid'?{...fixture,period:{start:'2026-01-01',end:'2026-01-14'}}:fixture;
                    return route.fulfill({status:200,contentType:'application/json',headers:{'access-control-allow-origin':'*'},body:JSON.stringify(body)});
                  }
                  return route.abort();
                });
                await live.goto(base,{waitUntil:'domcontentloaded'});
                const online=await live.evaluate(async b=>{
                  const s=await calendarSnapshot27(true);
                  const saved=await writeCache51(b);
                  return {source:s.source,checked:s.manifest.checked,groups:s.files?.size,saved,warning:s.warning||''};
                },fixture);
                assert.deepEqual(online,{source:'current',checked:manifest.checked,groups:83,saved:true,warning:''});
                responseMode='invalid';
                const invalid=await live.evaluate(async()=>{
                  const s=await calendarSnapshot27(true);
                  return {source:s.source,checked:s.manifest.checked,warning:!!s.warning};
                });
                assert.deepEqual(invalid,{source:'current',checked:manifest.checked,warning:true});
                responseMode='offline';
                await live.reload({waitUntil:'domcontentloaded'});
                const offline=await live.evaluate(async()=>{
                  const s=await calendarSnapshot27(true);
                  return {source:s.source,checked:s.manifest.checked,cached:!!s.cached,warning:!!s.warning,groups:s.files?.size};
                });
                assert.deepEqual(offline,{source:'current',checked:manifest.checked,cached:true,warning:true,groups:83});
                findings.push({test:'live bundle and offline cache',passed:true});
              } catch(e) {findings.push({test:'live bundle and offline cache',error:String(e)})}
              finally {await liveContext.close()}
              for (const [name,viewport] of Object.entries({ desktop:{width:1440,height:900}, mobile:{width:390,height:844}, narrow:{width:320,height:720} })) {
                const context = await browser.newContext({viewport, isMobile:name!=='desktop', hasTouch:name!=='desktop'});
                const page = await context.newPage();
                const errors = [], failedLocal = []; page.setDefaultTimeout(10000);
                page.on('pageerror', e => errors.push(e.message));
                page.on('response', r => { if(r.url().startsWith(base) && r.status()>=400 && !r.url().endsWith('favicon.ico')) failedLocal.push(r.status()+' '+r.url()); });
                page.on('requestfailed', r => { if(r.url().startsWith(base) && r.failure()?.errorText!=='net::ERR_ABORTED') failedLocal.push(r.url()+' '+r.failure()?.errorText); });
                // External map availability is not an internal navigation check.
                await page.route('**/*', route => route.request().url().startsWith(base) ? route.continue() : route.abort());
                await page.goto(base,{waitUntil:'domcontentloaded'});
                await page.locator('#nav .nav-main12 button').first().waitFor();
                assert.equal(await page.locator('#nav .nav-main12 button').count(),6);
                for (const [section,id,tools] of pages) {
                  try {
                    await page.locator('#nav .nav-main12 [data-tab="'+section+'"]').click();
                    if(id!==section) await page.locator('#nav .nav-sub12 [data-tab="'+id+'"]').click();
                    await page.locator('#tool16-'+id).waitFor();
                    for (const tool of tools) {
                      const head = page.locator('#tool16-'+tool+' .foldhead16');
                      if(await head.getAttribute('aria-expanded')!=='true') await head.click();
                      await page.locator('#tool16-'+tool+' .foldbody16').waitFor();
                    }
                    if(id==='home12') {
                      const home=page.locator('#tool16-home12');
                      for(const title of ['1. Исходное расписание','2. Критерии и ограничения оптимизации','3. Расчёт и сравнение альтернатив']){
                        assert.ok(await home.getByRole('heading',{name:title,exact:true}).isVisible());
                      }
                      await home.getByRole('button',{name:'Расчёт альтернатив',exact:true}).waitFor();
                      await page.waitForFunction(()=>{const d=visual12.homeDiag;return !!d&&d.checked===visual12.calendar?.checked},null,{timeout:30000});
                      const metrics=await page.evaluate(()=>({groups:visual12.homeDiag.groups.length,cards:visual12.homeDiag.totals.cards,windows:visual12.homeDiag.totals.windows}));
                      assert.deepEqual(metrics,{groups:83,cards:2599,windows:92});
                      assert.ok(await home.locator('.metric').filter({hasText:'Окна между парами'}).locator('strong').filter({hasText:/^92$/}).isVisible());
                    }
                    if(id==='space12') {
                      await page.locator("#campusRefresh28").waitFor();
                      await page.locator("#tool16-space12 .source23").waitFor({timeout:30000});
                      await page.locator('#mapLoad53').click();
                      await page.locator('#mapFrom53').waitFor({timeout:30000});
                      assert.equal(await page.locator('#mapFrom53 option').count(),4);
                      await page.locator('#mapFrom53').selectOption('12');
                      await page.locator('#mapTo53').selectOption('01');
                      const pilotMap = page.locator('svg[aria-label^="Схема взаимного расположения"]');
                      assert.equal(await pilotMap.locator('polyline').count(),1);
                      await page.locator('#mapReverse53').click();
                      assert.equal(await page.locator('#mapFrom53').inputValue(),'01');
                      await page.locator('#mapTo53').selectOption('01');
                      assert.equal(await pilotMap.locator('polyline').count(),0);
                      assert.ok(await page.getByText('Выбран один корпус.',{exact:false}).isVisible());
                      await page.locator('#loadRooms18').click();
                      await page.locator('#roomTemplate18').waitFor({timeout:30000});
                      assert.ok(await page.locator('#roomExport18').isVisible());
                    }
                    if(id==='group07') {
                      await page.locator('#personalGroup23').selectOption('Д-Э 401');
                      await page.locator('#personalWeek23').waitFor({timeout:30000});
                      assert.match(await page.locator('#personalWeek23 option').first().textContent(),/Верхняя/);
                      assert.match(await page.locator('#personalWeek23 option').nth(1).textContent(),/Нижняя/);
                      await page.locator('#personalWeek23').selectOption({index:0});
                      assert.equal(await page.locator('.personal-lesson23').count(),15);
                      await page.locator('#personalDay23').selectOption('2026-11-23');
                      assert.equal(await page.locator('.personal-lesson23').count(),3);
                      assert.ok(await page.getByText('Финансовые вычисления',{exact:true}).first().isVisible());
                      await page.locator('#advancedToggle23').click();
                      await page.locator('#groupId07').waitFor();
                      await page.locator('#advancedToggle23').click();
                      await page.locator('#personalDay23').selectOption('all');
                    }
                    if(id==='scenarios') {
                      await page.locator('[data-guide45="manual"]').click();
                      await page.locator('#runOpportunities29').click();
                      await page.locator('#export29').waitFor({timeout:30000});
                      await page.locator('[data-view29="readiness"]').click();
                      assert.ok(await page.getByText('Что известно для расчёта?',{exact:true}).isVisible());
                      await page.locator('#course29').selectOption('4');
                      await page.locator('[data-view29="moves"]').click();
                      if(await page.locator('[data-move29]').count()){
                        await page.locator('[data-move29]').first().click();
                        await page.locator('#moveDetail29').waitFor();
                      }
                      await page.locator('#course29').selectOption('all');
                      await page.locator('#runInterday33').click();
                      await page.locator('#interExport33').waitFor({timeout:30000});
                      await page.locator('#interWeek33').selectOption('lower');
                      await page.locator('#interStrict33').check();
                      await page.locator('#jointChoice30').waitFor({timeout:30000});
                      await page.locator('#jointChoice30').selectOption('strict');
                      assert.ok(await page.locator('#jointPanel30').isVisible());
                      await page.locator('#jointChoice30').selectOption('windows');
                      await page.locator('[data-guide45="research"]').click();
                      await page.locator('#reportHTML30').waitFor();
                      await page.getByText('Открыть аналитическую записку',{exact:true}).click();
                      assert.ok(await page.getByText('Аналитическая записка: организация учебного процесса',{exact:true}).isVisible());
                      await page.getByText('Открыть аналитическую записку',{exact:true}).click();
                      // Test the main guided optimizer, not only its legacy screening tools.
                      if(name==='desktop'){
                        await page.locator('#guideCourse45').selectOption('5');
                        await page.locator('#guideLimit45').selectOption('5');
                        await page.locator('#includeSwaps47').uncheck();
                        await page.locator('#guideRun45').click();
                        await page.locator('#guideResults45').waitFor({timeout:180000});
                        assert.equal(await page.locator('[data-pick45]').count(),4);
                        const choices=page.locator('#guideResults45 .choice45');
                        assert.equal(await choices.count(),4);
                        for(const card of await choices.all()){
                          assert.match(await card.innerText(),/Исходное → расчётное значение/);
                          assert.match(await card.locator('dd').first().innerText(),/^\d+ → \d+ \((?:−\d+|\+\d+|0)\)$/);
                          assert.ok(await card.getByText('Окна преподавателей, ед.',{exact:true}).isVisible());
                          assert.ok(await card.getByText('Проверка данных:',{exact:true}).isVisible());
                          assert.equal(await card.locator('details').getAttribute('open'),null);
                        }
                        const compare55=page.getByRole('region',{name:'Сравнение моделей'});
                        assert.equal(await compare55.locator('tbody tr').count(),8);
                        assert.equal(await compare55.locator('thead button').count(),4);
                        await compare55.locator('thead button').nth(2).click();
                        assert.equal(await page.locator('[data-pick45="2"]').getAttribute('aria-pressed'),'true');
                        assert.match(await compare55.innerText(),/Сравнение по 7 критериям/);
                        await page.locator('#chartMetric51').selectOption('windows');
                        await page.locator('[data-pick45="1"]').click();
                        assert.equal(await page.locator('[data-pick45="1"]').getAttribute('aria-pressed'),'true');
                        assert.ok(await page.locator('#guideExport45').isVisible());
                        findings.push({test:'guided four-model optimizer',passed:true});
                      }

                    }
                    if(id==='baseline09') {
                      await page.locator('#exportDiag25').waitFor({timeout:30000});
                      assert.equal(await page.locator('#courseDiag25 option').count(),6);
                      await page.locator('#courseDiag25').selectOption('4');
                      assert.ok(await page.locator('[data-diag-group25]').count()>0);
                      await page.locator('#courseDiag25').selectOption('all');
                      await page.locator('[data-analysis26="weeks"]').click();
                      await page.locator('#exportWeeks32').waitFor({timeout:30000});
                      assert.equal(await page.locator('[data-week-group32]').count(),166);
                      await page.locator('#period32').selectOption('2026-11-30');
                      assert.equal(await page.locator('[data-week-group32]').count(),83);
                      await page.locator('[data-analysis26="teachers"]').click();
                      await page.locator('#exportResource26').waitFor({timeout:30000});
                      assert.ok(await page.locator('[data-resource26]').count()>0);
                      await page.locator('[data-resource26]').first().click();
                      await page.locator('#resourceDetail26').waitFor();
                      await page.locator('[data-analysis26="rooms"]').click();
                      assert.ok(await page.locator('[data-resource26]').count()>0);
                      await page.locator('[data-analysis26="disciplines"]').click();
                      await page.locator("#disciplineExport28").waitFor({timeout:30000});
                      await page.locator("#disciplineGroup28").selectOption({index:1});
                      assert.equal(await page.locator("#disciplineGroup28 option").count(),83);
                      await page.locator('[data-analysis26="evidence"]').click();
                      await page.locator('#reviewExport31').waitFor({timeout:30000});
                      await page.locator('[data-review-select31]').first().click();
                      await page.locator('#reviewDetail31').waitFor();
                      await page.locator('[data-review-mode31="teachers"]').click();
                      assert.ok(await page.locator('[data-review-select31]').count()>0);
                      await page.locator('[data-review-mode31="subgroups"]').click();
                      assert.ok(await page.locator('[data-review-select31]').count()>0);
                      await page.locator('[data-analysis26="groups"]').click();

                    }
                    // Wait for local fetches without requiring external services.
                    await page.waitForLoadState('networkidle');
                    await page.screenshot({path:'browser-report/'+name+'-'+id+'.png',fullPage:true});
                    const dom = await page.evaluate(() => {
                      const ids = Array.from(document.querySelectorAll('[id]'), n => n.id);
                      const overflow = Math.max(0,document.documentElement.scrollWidth-innerWidth);
                      const escaped = Array.from(document.querySelectorAll('main *')).filter(n=>{
                        if(n.closest('.scroll') || !n.getClientRects().length) return false;
                        const r=n.getBoundingClientRect();
                        return r.width>0 && (r.right>innerWidth+4 || r.left< -4);
                      }).slice(0,20).map(n=>({tag:n.tagName,id:n.id,cls:String(n.getAttribute('class')||'').slice(0,120)}));
                      return {duplicates:ids.filter((v,i)=>ids.indexOf(v)!==i), overflow, escaped};
                    });
                    findings.push({viewport:name,page:id,...dom});
                    assert.deepEqual(dom.duplicates,[]);
                    for(const tool of tools) {
                      const head=page.locator('#tool16-'+tool+' .foldhead16');
                      await head.click();
                      assert.equal(await head.getAttribute('aria-expanded'),'false');
                    }
                  } catch(e) { findings.push({viewport:name,page:id,error:String(e)}); }
                }
                findings.push({viewport:name,pageErrors:errors,failedLocal});
                await context.close();
              }
            } finally {
              fs.writeFileSync('browser-report/results.json',JSON.stringify(findings,null,2));
              await browser.close();
            }
            console.log(JSON.stringify(findings,null,2));
            if(findings.some(x=>x.error||x.duplicates?.length||x.pageErrors?.length||x.failedLocal?.length||x.overflow>4||x.escaped?.length)) process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Upload screenshots and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kantor-browser-report
          path: browser-report/
          if-no-files-found: warn
