name: KANTOR calendar comparison
on:
  push:
    paths:
      - 'ingest/compare_calendar.py'
      - '.github/workflows/calendar-comparison.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python ingest/compare_calendar.py
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-pilot
          path: data/calendar-pilot-10.json
      - name: Preserve review-only calendar snapshot
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar-pilot-10.json
          if ! git diff --cached --quiet; then
            git commit -m "Preserve bounded public calendar comparison pilot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
