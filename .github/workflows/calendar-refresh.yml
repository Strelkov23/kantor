name: KANTOR daily calendar refresh
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-refresh.yml'
permissions:
  contents: write
concurrency:
  group: kantor-calendar-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.13.4
      - name: Offline publication gate tests
        run: python ingest/test_calendar_publication.py
      - name: Collect in isolation (83 public pages)
        run: python ingest/compare_institute_calendar.py --out "$RUNNER_TEMP/kantor-calendar" --require-complete
      - name: Validate and package
        run: python ingest/package_current_calendar.py "$RUNNER_TEMP/kantor-calendar" "$RUNNER_TEMP/current-calendar.json"
      - name: Publish complete snapshot only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kantor-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Retry only on a concurrent branch update, rechecking ordering each time.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/current
            python ingest/check_snapshot_order.py "$RUNNER_TEMP/current-calendar.json" data/current/calendar.json
            cp "$RUNNER_TEMP/current-calendar.json" data/current/calendar.json
            git add data/current/calendar.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh public institute calendar (validated complete snapshot)"
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 3
          done
      - name: Keep collection diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-refresh-diagnostics
          path: |
            ${{ runner.temp }}/kantor-calendar/manifest.json
          if-no-files-found: warn
          retention-days: 14
