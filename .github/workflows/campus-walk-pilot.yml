name: KANTOR six walking estimates
on:
  push:
    paths:
      - '.github/workflows/campus-walk-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python spatial/osm_walk_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: campus-walk-estimates
          path: osm-walk-pilot.json
          retention-days: 14
