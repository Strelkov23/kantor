name: KANTOR institute calendar review
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kantor-calendar-refresh
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.13.4
      - name: Collect review snapshot without changing frozen data
        run: python ingest/compare_institute_calendar.py --out "$RUNNER_TEMP/kantor-review" --require-complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: institute-calendar-review
          path: ${{ runner.temp }}/kantor-review/
          if-no-files-found: warn
          retention-days: 14
