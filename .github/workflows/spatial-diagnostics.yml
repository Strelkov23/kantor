name: KANTOR spatial diagnostics
on:
  push:
    paths:
      - 'ingest/calendar_spatial.py'
      - '.github/workflows/spatial-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python ingest/calendar_spatial.py
      - name: Preserve calendar spatial report
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar-spatial-13.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish calendar-based spatial diagnostics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
