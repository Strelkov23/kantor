name: KANTOR interface checks
on:
  push:
    paths:
      - 'index.html'
      - '**.js'
      - 'data/**'
      - 'tests/workspaces.cjs'
      - '.github/workflows/ui-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/workspaces.cjs
