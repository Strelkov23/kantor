if(tab==="overview"){let a=evaluate(baseline),b=result.length?evaluate(result):null;body='<section class="panel"><div class="row between"><div><h2>Панель исследования</h2><p class="muted">Двухнедельный цикл · 5 дней · 5 учебных интервалов в день</p></div><button class="primary" id="go">Настроить оптимизацию</button></div><div class="grid">'+[["Учебные группы",data.groups.length],["Преподаватели",data.teachers.length],["Аудитории",data.rooms.length],["Занятия по плану",data.lessons.length]].map(([k,v])=>'<div class="metric"><small>'+k+'</small><strong>'+v+'</strong></div>').join("")+'</div></section><section class="panel"><h2>Сравнение вариантов</h2><p class="muted">Серый — исходное, зелёный — рассчитанное. Меньше — лучше; сравнивать только при полном и допустимом расписании.</p><div class="grid"><div class="metric"><small>Исходная целевая функция</small><strong>'+fmt(score(a))+'</strong></div><div class="metric"><small>Рассчитанная целевая функция</small><strong>'+(b?fmt(score(b)):"—")+'</strong></div><div class="metric"><small>Изменение оценки</small><strong>'+(b&&check(baseline).length===0&&check(result).length===0&&score(a)>0?fmt(100*(score(b)/score(a)-1))+"%":"—")+'</strong></div></div><p>'+(b?esc(runInfo.status):"Запустите расчёт, чтобы получить второй вариант.")+'</p>'+metrics.map(([k,n,u])=>{let max=Math.max(a[k],b?.[k]||0,1);return '<div class="chartrow"><div class="row between"><b>'+n+'</b><span>'+fmt(a[k])+' → '+(b?fmt(b[k]):"—")+' '+u+'</span></div><div class="bar"><i style="width:'+100*a[k]/max+'%"></i></div>'+(b?'<div class="bar new"><i style="width:'+100*b[k]/max+'%"></i></div>':"")+'</div>'}).join("")+'<div class="row"><button id="exportReport">Экспорт эксперимента JSON</button><button id="exportChart" '+(b?"":"disabled")+'>График SVG для статьи</button></div></section>'}

if(tab==="optimize"){body='<section class="panel"><h2>Управление целевой функцией</h2><p>Установите веса штрафов. Жёсткие ограничения не зависят от весов. Вес 0 исключает критерий из оценки.</p><div class="grid">'+metrics.map(([k,n,u])=>'<label>'+n+' ('+u+')<input type="number" min="0" max="1000" step="0.01" data-weight="'+k+'" value="'+weights[k]+'"></label>').join("")+'</div><p class="muted">Вес изменений полезен при оперативном перепланировании. Метрики имеют разные единицы измерения; веса выражают относительную стоимость штрафов, а не нормативы.</p><div class="row"><label>Итерации<input id="iter" type="number" min="100" max="20000" step="100" value="4500"></label><label>Seed<input id="seed" type="number" value="2026"></label><button class="primary" id="run" '+(busy?"disabled":"")+'>Рассчитать расписание</button></div><p id="status" role="status">'+esc(report)+'</p>'+(runInfo?'<p>'+esc(runInfo.status)+'<br>Время: '+runInfo.ms+' мс · итерации: '+runInfo.iter+' · seed: '+runInfo.seed+'</p>':"")+'</section><section class="panel"><h3>Жёсткие ограничения</h3><p>Учебный план, отсутствие пересечений, тип и вместимость помещения, доступность ресурсов, фиксированные занятия, дневные лимиты, физическая достижимость корпусов.</p></section>'}
if(tab==="checks"){let a=check(baseline),b=result.length?check(result):null;body='<section class="panel"><h2>Проверка допустимости</h2>'+[["Исходное",a],["Рассчитанное",b]].map(([n,e])=>'<h3>'+n+'</h3><p class="'+(e&&e.length?"bad":"good")+'">'+(e?(e.length?e.length+" замечаний":"Все реализованные ограничения соблюдены"):"Расчёт ещё не выполнен")+'</p>'+(e&&e.length?'<details><summary>Показать замечания</summary><ul>'+e.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></details>':"")).join("")+'<p class="muted">Проверка выполняется отдельно от целевой функции, но использует те же определения ограничений. Не является внешней независимой сертификацией.</p></section><section class="panel"><h2>Аудиторный фонд</h2><div class="scroll"><table><tr><th>Аудитория</th><th>Корпус</th><th>Мест</th><th>Назначено / 50 интервалов</th></tr>'+data.rooms.map(r=>'<tr><td>'+esc(r.name||r.id)+'</td><td>'+esc(r.building)+'</td><td>'+r.capacity+'</td><td>'+active().filter(x=>x.room===r.id).length+' / 50</td></tr>').join("")+'</table></div></section>'}
if(tab==="data"){body="<section class=\"panel\"><h2>Пилот: Институт экономики и управления АПК</h2><p>Официальные расписания 1–5 курсов, первый семестр 2026/2027. Источники найдены; полная оцифровка ещё не выполнена. Расчёты версии 0.1 по-прежнему демонстрационные.</p><div class=\"scroll\"><table><tr><th>Курс</th><th>Страниц</th><th>Источник</th></tr><tr><td>1 курс</td><td>4</td><td><a href=\"https://www.timacad.ru/uploads/files/20261016/1792149829_ieiu-1.pdf\" target=\"_blank\" rel=\"noopener\">Официальное расписание PDF</a></td></tr><tr><td>2 курс</td><td>4</td><td><a href=\"https://www.timacad.ru/uploads/files/20261016/1792149840_ieiu-2.pdf\" target=\"_blank\" rel=\"noopener\">Официальное расписание PDF</a></td></tr><tr><td>3 курс</td><td>4</td><td><a href=\"https://www.timacad.ru/uploads/files/20261027/1793083289_ieiu-3.pdf\" target=\"_blank\" rel=\"noopener\">Официальное расписание PDF</a></td></tr><tr><td>4 курс</td><td>3</td><td><a href=\"https://www.timacad.ru/uploads/files/20261016/1792149864_ieiu-4.pdf\" target=\"_blank\" rel=\"noopener\">Официальное расписание PDF</a></td></tr><tr><td>5 курс</td><td>1</td><td><a href=\"https://www.timacad.ru/uploads/files/20261016/1792149886_ieiu-5.pdf\" target=\"_blank\" rel=\"noopener\">Официальное расписание PDF</a></td></tr></table></div><p><a href=\"sources-2026.json\">Реестр источников JSON</a> · <a href=\"https://www.timacad.ru/about/sveden/document/rezhim-zaniatii-obuchaiushchikhsia\" target=\"_blank\" rel=\"noopener\">Официальный раздел академии</a></p></section>"+'<section class="panel"><h2>Импорт и справочники</h2><p>Загрузите JSON по демонстрационному шаблону либо отредактируйте его ниже. Идентификаторы должны быть уникальными; интервалы 0–24 — первая неделя, 25–49 — вторая. Типы помещений и занятий должны совпадать.</p><div class="row"><input id="upload" type="file" accept=".json,application/json"><button id="template">Скачать текущие данные</button><button id="reset">Вернуть демо</button></div><textarea id="json" spellcheck="false" aria-label="Исходные данные">'+esc(draft)+'</textarea><div class="row"><button class="primary" id="apply">Применить JSON</button><span id="dataStatus" role="status"></span></div></section><section class="panel"><h3>Состав модели</h3><div class="scroll"><table><tr><th>Сущность</th><th>Поля</th></tr><tr><td>groups</td><td>id, name, size, unavailable (необязательно)</td></tr><tr><td>teachers</td><td>id, name, unavailable</td></tr><tr><td>rooms</td><td>id, name, building, capacity, type, unavailable</td></tr><tr><td>lessons</td><td>id, title, groups[], teacher, week (0/1), type, fixed (slot, room; необязательно)</td></tr><tr><td>travel</td><td>Ключ «Корпус А|Корпус Б», минут между корпусами</td></tr><tr><td>baseline</td><td>Массив {id, slot, room}, одно назначение на занятие</td></tr></table></div></section>'}
if(tab==="method"){body='<section class="panel"><h2>Научная методология</h2><p>Задача дискретного распределения ограниченных ресурсов в традиции Л. В. Канторовича. Каждому занятию назначается одна допустимая пара (время, аудитория). Цели устанавливаются человеком.</p><h3>Целевая функция</h3><p>F = w₁Wₛ + w₂Wₜ + w₃M + w₄B + w₅R + w₆C → min.</p><div class="scroll"><table><tr><th>Показатель</th><th>Формула и интерпретация</th></tr><tr><td>Wₛ, Wₜ</td><td>По каждому ресурсу и дню: последний номер пары − первый + 1 − число занятий. Сумма по группам и преподавателям.</td></tr><tr><td>M</td><td>Сумма минут переходов между последовательными занятиями каждого преподавателя и группы. Это ресурсо-минуты, а не человеко-минуты.</td></tr><tr><td>B</td><td>Сумма n(n−1)/2 по дням и группам. Штраф за концентрацию занятий; не измеряет реальную утомляемость.</td></tr><tr><td>R</td><td>Сумма вместимости назначенной аудитории минус суммарная численность групп. Не показатель простоя помещения.</td></tr><tr><td>C</td><td>Число занятий, изменивших слот или аудиторию относительно исходного.</td></tr></table></div><h3 style="margin-top:20px">Алгоритм версии 0.1</h3><p>Генерация допустимых назначений, жадное построение начального решения с повторными попытками, затем стохастический локальный поиск с имитацией отжига и сохранением лучшего допустимого решения. Seed и число итераций фиксируются для воспроизводимости.</p><p><b>Ограничения метода:</b> глобальный оптимум и нижняя граница не доказаны; отсутствие решения не означает несовместность условий. Нет интеграции с информационной системой академии, нормативы и временная сетка демонстрационные. Следующая исследовательская версия — CP-SAT, сравнение алгоритмов и расчёт границы оптимальности.</p><h3>Научная основа</h3><p>Канторович Л. В. Математические методы организации и планирования производства. 1939.</p><p>Шилин О. А. Использование современных цифровых средств как инструмента организации образовательного процесса // Вопросы студенческой науки. 2025. № 4 (104). С. 140–144. Критерии требований к расписанию, с. 141; сравнение программ, с. 142–143; роль методиста, с. 144.</p><p>Критерии из статьи адаптированы: сложность дисциплин, индивидуальные учебные планы и психофизиологические особенности пока не реализованы.</p></section>'}
return body}

function bind(){bindWorkspace16();bindInstitute();bindVisual12();bindSurvey15();bindCampus13();bindSpatial13();bindRefined14();bindRooms18();bindRoute22();bindPersonal23();bindComparison24();bindDiag25();bindResource26();document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{activate16(b.dataset.tab,true)});on("go","click",()=>{tab="optimize";render()});on("view","change",e=>{view=e.target.value;render()});on("week","change",e=>{weekView=+e.target.value;render()});on("filterType","change",e=>{filterType=e.target.value;filterId="";render()});on("filterId","change",e=>{filterId=e.target.value;render()});on("csv","click",exportSchedule);on("exportReport","click",exportReport);on("exportChart","click",exportChart);document.querySelectorAll("[data-weight]").forEach(x=>x.onchange=()=>{let n=Number(x.value);weights[x.dataset.weight]=Number.isFinite(n)?Math.max(0,Math.min(1000,n)):0;x.value=weights[x.dataset.weight];result=[];runInfo=null;report="Веса изменены. Запустите новый расчёт.";if($("status"))$("status").textContent=report});on("run","click",()=>{if(busy)return;let iter=Math.max(100,Math.min(20000,Math.trunc(+$("iter").value||4500))),seed=Math.trunc(+$("seed").value||2026);busy=true;$("run").disabled=true;$("status").textContent="Выполняется расчёт…";setTimeout(()=>{try{let r=solve(iter,seed);result=r.arr;runInfo=r.info;view="result";report=r.info.status;tab="overview"}catch(e){report=e.message}finally{busy=false;render()}},30)});on("json","input",e=>{draft=e.target.value});on("upload","change",async e=>{let f=e.target.files[0];if(f){draft=await f.text();$("json").value=draft}});on("apply","click",()=>{try{let d=validate(JSON.parse($("json").value));init(d);render();$("dataStatus").textContent="Данные приняты."}catch(e){$("dataStatus").textContent=e.message}});on("template","click",()=>download("kantor-data.json",JSON.stringify({...data,baseline},null,2),"application/json"));on("reset","click",()=>{init(demo());render()})}

ля двух групп.</p><div class="row"><label>Половина таблицы<select id="pilotWeek"><option value="0" '+(pilotWeek===0?"selected":"")+'>Верхняя</option><option value="1" '+(pilotWeek===1?"selected":"")+'>Нижняя</option></select></label><label>Группа<select id="pilotGroup">'+["all","Д-Э 508","Д-Э 509"].map(k=>'<option value="'+k+'" '+(k===pilotGroup?"selected":"")+'>'+(k==="all"?"Обе":k)+'</option>').join("")+'</select></label><button id="pilotExport">Экспорт исходного пилота JSON</button></div>'+pilotTable(fifthPilot.records)+'</section>'}
function pilotTable(arr){return '<div class="scroll"><table><tr><th>День / время</th><th>Группы</th><th>Дисциплина</th><th>Преподаватель</th><th>Аудитория</th></tr>'+arr.filter(x=>x.week===pilotWeek&&(pilotGroup==="all"||x.groups.includes(pilotGroup))).sort((a,b)=>a.day-b.day||a.period-b.period||a.id.localeCompare(b.id)).map(x=>'<tr><td>'+days[x.day]+' '+times[x.period]+'</td><td>'+esc(x.groups.join(", "))+'</td><td>'+esc(x.title)+'</td><td>'+esc(x.teacher)+'</td><td>'+esc(x.room)+'</td></tr>').join("")+'</table></div>'}
function renderCampus(){return '<section class="panel"><h2>Пространственная модель кампуса</h2><p>Адреса из <a href="'+instituteCatalog.addressSource+'" target="_blank" rel="noopener">официального реестра</a>. <a href="'+instituteCatalog.campus+'" target="_blank" rel="noopener">Карта кампуса</a>. Время пеших маршрутов пока не измерено; адреса сами по себе не дают точного времени перехода.</p><div class="scroll"><table><tr><th>Корпус</th><th>Адрес, Москва</th></tr>'+Object.entries(instituteCatalog.buildings).map(([k,v])=>'<tr><td>'+esc(k)+'</td><td>'+esc(v)+'</td></tr>').join("")+'</table></div></section><section class="panel"><h2>Настройки переходов пилота</h2><p>В пятом курсе используются корпуса 02 и 03. Введите проверенное время пешего маршрута в минутах между входами, в обоих направлениях берётся одна величина. Дополнительный запас учитывает лестницы, выход и вход. Переходы между разными аудиториями одного корпуса тоже требуют запаса.</p><div class="row"><label>02 ↔ 03, мин (неизвестно)<input id="pilotWalk" type="number" min="0" max="120" step="1" value="'+esc(pilotWalk)+'"></label><label>Запас внутри зданий, мин (допущение)<input id="pilotBuffer" type="number" min="0" max="30" value="'+pilotBuffer+'"></label></div><p>Свободное время между парами: 20, 30, 20 и 20 минут по опубликованному расписанию. Недостаточное время — жёсткое нарушение, а не штраф. Все остальные маршруты требуют измерения перед полномасштабным расчётом.</p></section>'}
function pilotPeople(l){return ["t:"+l.teacher,...l.groups.map(g=>"g:"+g)]}
function pilotJourney(a,b){return (a.room===b.room?0:pilotBuffer)+(a.room.slice(0,2)===b.room.slice(0,2)?0:Number(pilotWalk))}
function pilotCompatible(c,arr){for(const a of arr){if(a.id===c.id||a.week!==c.week||a.day!==c.day)continue;let shared=pilotPeople(c).some(p=>pilotPeople(a).includes(p));if(a.period===c.period&&(shared||a.room===c.room))return false;if(shared&&Math.abs(starts[a.period]-starts[c.period])-duration<pilotJourney(a,c))return false}return true}
function pilotCheck(a){return a.filter(c=>!pilotCompatible(c,a)).length}
function pilotMetrics(arr){let m=[0,0,0,0,0,0],ag=new Map(),old=new Map(fifthPilot.records.map(x=>[x.id,x]));for(const a of arr){let b=old.get(a.id);if(a.day!==b.day||a.period!==b.period)m[5]++;for(const p of pilotPeople(a)){let k=p+":"+a.week+":"+a.day;if(!ag.has(k))ag.set(k,[]);ag.get(k).push(a)}}for(const [k,list] of ag){list.sort((a,b)=>a.period-b.period);let g=k.startsWith("g:");m[g?0:1]+=Math.max(0,list.at(-1).period-list[0].period+1-list.length);for(let i=1;i<list.length;i++)m[g?2:3]+=pilotJourney(list[i-1],list[i]);if(g)m[4]+=list.length*(list.length-1)/2}return m}
function pilotSolve(profile,seed){let rnd=rng(seed),base=fifthPilot.records,cur=base.map(x=>({...x})),f=m=>m.reduce((s,v,i)=>s+profile.w[i]*v,0),v=f(pilotMetrics(cur)),viol=pilotCheck(cur),best=null,bv=Infinity;for(let i=0;i<8000;i++){let j=Math.floor(rnd()*cur.length),old=cur[j],c={...old,day:Math.floor(rnd()*5),period:Math.floor(rnd()*5)};if(!pilotCompatible(c,cur))continue;cur[j]=c;let n=pilotCheck(cur),s=f(pilotMetrics(cur)),temp=Math.max(.1,6*(1-i/8000));if(n<viol||(n===viol&&(s<=v||rnd()<Math.exp((v-s)/temp)))){v=s;viol=n;if(!n&&s<bv){best=cur.slice();bv=s}}else cur[j]=old}if(!pilotCheck(base)&&f(pilotMetrics(base))<bv)best=base.map(x=>({...x}));return {name:profile.name,weights:profile.w,arr:best,metrics:best?pilotMetrics(best):null,seed}}
function renderScenarios(){return '<section class="panel"><h2>Варианты оптимизации · пилот 5 курса</h2><p>Эксперимент с 41 назначением в двух половинах таблицы. Сохраняются дисциплины, преподаватели, группы, аудитории и недельный цикл. Меняется только время занятия. Проверяется пересечение групп, преподавателей, помещений и достижимость переходов.</p><p class="notice">Не учитывается занятость ресурсов за пределами этих двух групп, фактическая доступность преподавателей, вместимость и локальные нормативы. Поэтому даже внутренне допустимый вариант — исследовательский сценарий, а не готовое к внедрению расписание.</p><div class="grid">'+profiles.map(p=>'<div class="metric"><b>'+p.name+'</b><small style="display:block">Веса: '+p.w.join(" / ")+'</small></div>').join("")+'</div><p class="muted">Веса: окна групп / окна преподавателей / путь групп / путь преподавателей / концентрация нагрузки / изменения. Общая оценка разных сценариев не сравнивается напрямую: сравниваются исходные показатели.</p><div class="row"><label>02 ↔ 03, проверенные минуты<input id="pilotWalk" type="number" min="0" max="120" value="'+esc(pilotWalk)+'"></label><label>Запас, мин<input id="pilotBuffer" type="number" min="0" max="30" value="'+pilotBuffer+'"></label><button class="primary" id="pilotRun">Рассчитать пять вариантов</button></div><p id="pilotStatus" role="status">'+esc(pilotError)+'</p>'+(pilotRuns.length?pilotResults():"")+'</section><section class="panel"><h3>Технология расчёта</h3><p>В пилоте — воспроизводимый локальный поиск, 8000 итераций на сценарий. Глобальный оптимум не доказан. Неизмеренный путь не подменяется нулём. При изменении параметров результаты сбрасываются. Для полномасштабной модели нужен CP-SAT, календарные ограничения и полный набор данных.</p></section>'}
function pilotResults(){let n=["Окна групп, пар","Окна преподавателей, пар","Путь групп, группо-мин","Путь преподавателей, мин","Концентрация нагрузки","Перенесено занятий"];return '<p>Проверка исходного варианта: '+pilotCheck(fifthPilot.records)+' назначений с внутренними нарушениями при введённых параметрах.</p><div class="scroll"><table><tr><th>Показатель</th><th>Исходное</th>'+pilotRuns.map(x=>'<th>'+esc(x.name)+'</th>').join("")+'</tr>'+n.map((k,i)=>'<tr><td>'+k+'</td><td>'+pilotMetrics(fifthPilot.records)[i]+'</td>'+pilotRuns.map(x=>'<td>'+(x.metrics?x.metrics[i]:"не найден")+'</td>').join("")+'</tr>').join("")+'<tr><td>Внутренние нарушения</td><td>'+pilotCheck(fifthPilot.records)+'</td>'+pilotRuns.map(x=>'<td>'+(x.arr?pilotCheck(x.arr):"—")+'</td>').join("")+'</tr></table></div><div class="row"><label>Вариант<select id="pilotChoice">'+pilotRuns.map((x,i)=>'<option value="'+i+'" '+(i===pilotChoice?"selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select></label><label>Половина<select id="pilotWeek"><option value="0" '+(pilotWeek===0?"selected":"")+'>Верхняя</option><option value="1" '+(pilotWeek===1?"selected":"")+'>Нижняя</option></select></label><button id="pilotRunExport">Экспорт всех сценариев JSON</button></div>'+(pilotRuns[pilotChoice]?.arr?pilotTable(pilotRuns[pilotChoice].arr):'<p>Допустимый вариант не найден.</p>')}
function bindInstitute(){bind03();bind04();bind05();bind06();bind07();bindGroup07();bind08();bindBaseline09();bindPrograms10();bindCalendar11();on("catalogCourse","change",e=>{catalogCourse=e.target.value;render()});on("catalogSearch","change",e=>{catalogSearch=e.target.value;render()});on("pilotWeek","change",e=>{pilotWeek=+e.target.value;render()});on("pilotGroup","change",e=>{pilotGroup=e.target.value;render()});on("pilotChoice","change",e=>{pilotChoice=+e.target.value;render()});on("pilotExport","click",()=>download("fifth-year-source.json",JSON.stringify(fifthPilot,null,2),"application/json"));on("pilotWalk","change",e=>{pilotWalk=e.target.value;pilotRuns=[];pilotError="Параметры изменены. Требуется новый расчёт."});on("pilotBuffer","change",e=>{pilotBuffer=+e.target.value;pilotRuns=[];pilotError="Параметры изменены. Требуется новый расчёт."});on("pilotRun","click",()=>{pilotWalk=$("pilotWalk").value;pilotBuffer=+$("pilotBuffer").value;if(pilotWalk.trim()===""||!Number.isFinite(+pilotWalk)||+pilotWalk<0||+pilotWalk>120||!Number.isFinite(pilotBuffer)||pilotBuffer<0||pilotBuffer>30){pilotError="Введите проверенное время пути 0–120 минут и запас 0–30 минут.";render();return}pilotError="Расчёт…";$("pilotStatus").textContent=pilotError;$("pilotRun").disabled=true;setTimeout(()=>{pilotRuns=profiles.map((p,i)=>pilotSolve(p,2026+i));pilotChoice=0;pilotGroup="all";pilotError="Расчёт завершён. Необходима внешняя проверка доступности ресурсов.";render()},20)});on("pilotRunExport","click",()=>download("pilot-scenarios.json",JSON.stringify({source:fifthPilot,walk:+pilotWalk,buffer:pilotBuffer,runs:pilotRuns},null,2),"application/json"))}
