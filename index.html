</style></head><body><header><div><small>НАУЧНО-ПРИКЛАДНОЙ ПРОЕКТ · 0.1</small><h1>КАНТОР</h1><p>Цифровое оптимизационное планирование учебного процесса</p></div><span class="tag">Исследовательский прототип · РГАУ–МСХА</span></header>
<main><div class="notice" id="notice"></div><nav id="nav"></nav><div id="screen"></div><footer>КАНТОР · Исследовательская инициатива, не официальный сервис академии. Данные обрабатываются локально в браузере.</footer></main>
<script>
"use strict";
const days=["Пн","Вт","Ср","Чт","Пт"], times=["08:30","10:10","11:50","13:40","15:20"], starts=[510,610,710,820,920], duration=90;
const $=id=>document.getElementById(id), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])), slot=(w,d,p)=>w*25+d*5+p, week=s=>Math.floor(s/25), day=s=>Math.floor(s%25/5), period=s=>s%5;
const metrics=[["studentGaps","Окна студентов","пар"],["teacherGaps","Окна преподавателей","пар"],["travel","Переходы между корпусами","мин"],["balance","Концентрация нагрузки","балл"],["waste","Свободные места на занятиях","мест"],["changes","Изменённые занятия","зан."]];
let weights={studentGaps:8,teacherGaps:5,travel:1,balance:3,waste:.04,changes:0}, data, baseline=[], result=[], report="", tab="overview", view="result", filterType="group", filterId="", weekView=0, busy=false, runInfo=null, draft="";
function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function demo(){let groups=Array.from({length:6},(_,i)=>({id:"G"+(i+1),name:"ЭК-"+(101+i),size:18+(i%3)*6})), teachers=Array.from({length:8},(_,i)=>({id:"T"+(i+1),name:"Преподаватель "+(i+1)})), rooms=[{id:"R1",name:"А-101",building:"А",capacity:36,type:"standard"},{id:"R2",name:"А-102",building:"А",capacity:28,type:"standard"},{id:"R3",name:"А-103",building:"А",capacity:70,type:"standard"},{id:"R4",name:"Б-201",building:"Б",capacity:36,type:"standard"},{id:"R5",name:"Б-202",building:"Б",capacity:32,type:"lab"},{id:"R6",name:"В-301",building:"В",capacity:60,type:"standard"},{id:"R7",name:"В-302",building:"В",capacity:30,type:"lab"}], lessons=[];let names=["Экономика","Математика","Информатика","История","Статистика","Иностранный язык"];
for(let w=0;w<2;w++)for(let g=0;g<6;g++)for(let k=0;k<6;k++)lessons.push({id:"L"+(lessons.length+1),title:names[k],groups:[groups[g].id],teacher:teachers[(k+g%2)%8].id,week:w,type:k===2?"lab":"standard"});return {name:"Демонстрационная модель",demo:true,groups,teachers,rooms,lessons,travel:{"А|Б":8,"А|В":15,"Б|В":12},maxGroupDay:4,maxTeacherDay:4}}
function validate(d){if(!d||typeof d!=="object")throw Error("Нужен объект JSON");for(const k of ["groups","teachers","rooms","lessons"]){if(!Array.isArray(d[k])||!d[k].length)throw Error("Пустой справочник: "+k);if(d[k].length>1000)throw Error("Лимит прототипа: 1000 записей на справочник");let ids=new Set();for(const x of d[k]){if(!x||typeof x.id!=="string"||!x.id||ids.has(x.id))throw Error("Пустой или повторный ID: "+k);ids.add(x.id);if(x.unavailable&&(!Array.isArray(x.unavailable)||x.unavailable.some(s=>!Number.isInteger(s)||s<0||s>=50)))throw Error("Некорректные недоступные интервалы "+x.id)}}for(const g of d.groups)if(!Number.isInteger(g.size)||g.size<1)throw Error("Численность: "+g.id);for(const r of d.rooms)if(!Number.isInteger(r.capacity)||r.capacity<1||typeof r.building!=="string"||!r.building||typeof r.type!=="string")throw Error("Аудитория: "+r.id);let g=new Set(d.groups.map(x=>x.id)),t=new Set(d.teachers.map(x=>x.id)),r=new Set(d.rooms.map(x=>x.id));for(const l of d.lessons){if(!Array.isArray(l.groups)||!l.groups.length||new Set(l.groups).size!==l.groups.length||l.groups.some(x=>!g.has(x))||!t.has(l.teacher)||![0,1].includes(l.week)||typeof l.type!=="string")throw Error("Ссылки или неделя занятия: "+l.id);if(l.fixed&&(!Number.isInteger(l.fixed.slot)||week(l.fixed.slot)!==l.week||!r.has(l.fixed.room)))throw Error("Фиксация занятия: "+l.id)}for(const k of ["maxGroupDay","maxTeacherDay"])if(!Number.isInteger(d[k])||d[k]<1||d[k]>5)throw Error("Дневной лимит: "+k);if(!d.travel||typeof d.travel!=="object")throw Error("Нужна матрица travel");let bs=[...new Set(d.rooms.map(x=>x.building))];for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){let v=d.travel[bs[i]+"|"+bs[j]]??d.travel[bs[j]+"|"+bs[i]];if(!Number.isFinite(v)||v<0)throw Error("Нет времени перехода: "+bs[i]+" / "+bs[j])}if(d.baseline!==undefined){if(!Array.isArray(d.baseline))throw Error("baseline должен быть массивом");let ls=new Set(d.lessons.map(x=>x.id)), seen=new Set();for(const a of d.baseline){if(!a||!ls.has(a.id)||seen.has(a.id)||!r.has(a.room)||!Number.isInteger(a.slot)||a.slot<0||a.slot>=50)throw Error("Некорректная запись baseline");seen.add(a.id)}}return d}
let G,T,R,L, options;
function index(){G=new Map(data.groups.map(x=>[x.id,x]));T=new Map(data.teachers.map(x=>[x.id,x]));R=new Map(data.rooms.map(x=>[x.id,x]));L=new Map(data.lessons.map(x=>[x.id,x]));options=new Map(data.lessons.map(l=>{let a=[],n=l.groups.reduce((s,g)=>s+G.get(g).size,0);for(const r of data.rooms){if(r.capacity<n||r.type!==l.type)continue;for(let s=l.week*25;s<l.week*25+25;s++){if(r.unavailable?.includes(s)||T.get(l.teacher).unavailable?.includes(s)||l.groups.some(g=>G.get(g).unavailable?.includes(s)))continue;if(l.fixed&&(s!==l.fixed.slot||r.id!==l.fixed.room))continue;a.push({id:l.id,slot:s,room:r.id})}}return [l.id,a]}))}
function travel(a,b){let x=R.get(a.room).building,y=R.get(b.room).building;return x===y?0:(data.travel[x+"|"+y]??data.travel[y+"|"+x])}
function people(l){return ["t:"+l.teacher,...l.groups.map(g=>"g:"+g)]}
function compatible(c,arr){let l=L.get(c.id), ps=people(l),counts=new Map(ps.map(p=>[p,1]));for(const a of arr){if(!a||a.id===c.id)continue;if(a.slot===c.slot&&a.room===c.room)return false;if(week(a.slot)!==week(c.slot)||day(a.slot)!==day(c.slot))continue;let q=people(L.get(a.id));for(const p of ps){if(!q.includes(p))continue;if(a.slot===c.slot)return false;let gap=Math.abs(starts[period(a.slot)]-starts[period(c.slot)])-duration;if(travel(a,c)>gap)return false;let n=counts.get(p)+1;counts.set(p,n);if(n>(p[0]==="g"?data.maxGroupDay:data.maxTeacherDay))return false}}return true}
function check(arr){let errs=[],seen=new Set(),valid=[];for(const c of arr){if(!c||!L.has(c.id)||seen.has(c.id)){errs.push("Неизвестное или повторное занятие");continue}seen.add(c.id);if(!options.get(c.id).some(x=>x.slot===c.slot&&x.room===c.room)){errs.push(c.id+": недопустимое время, помещение или фиксированное условие");continue}if(!compatible(c,valid))errs.push(c.id+": конфликт ресурсов, дневного лимита или времени перехода");valid.push(c)}for(const l of data.lessons)if(!seen.has(l.id))errs.push(l.id+": не назначено");return errs}
function evaluate(arr,ref=baseline){let m={studentGaps:0,teacherGaps:0,travel:0,balance:0,waste:0,changes:0},agenda=new Map(),old=new Map(ref.map(x=>[x.id,x]));for(const a of arr){if(!a)continue;let l=L.get(a.id),r=R.get(a.room),b=old.get(a.id);m.waste+=r.capacity-l.groups.reduce((s,g)=>s+G.get(g).size,0);if(b&&(b.slot!==a.slot||b.room!==a.room))m.changes++;for(const p of people(l)){let key=p+":"+week(a.slot)+":"+day(a.slot);if(!agenda.has(key))agenda.set(key,[]);agenda.get(key).push(a)}}for(const [k,list] of agenda){list.sort((a,b)=>a.slot-b.slot);let gaps=Math.max(0,period(list[list.length-1].slot)-period(list[0].slot)+1-list.length);m[k[0]==="g"?"studentGaps":"teacherGaps"]+=gaps;if(k[0]==="g")m.balance+=list.length*(list.length-1)/2;for(let i=1;i<list.length;i++)m.travel+=travel(list[i-1],list[i])}return m}
const score=m=>metrics.reduce((s,[k])=>s+weights[k]*m[k],0);
function generate(seed=1729){let rand=rng(seed),order=[...data.lessons].sort((a,b)=>options.get(a.id).length-options.get(b.id).length),best=[];for(let retry=0;retry<8;retry++){let arr=[];for(const l of order){let opts=[...options.get(l.id)].map(a=>[rand(),a]).sort((a,b)=>a[0]-b[0]);let c=opts.find(([,a])=>compatible(a,arr));if(c)arr.push(c[1])}if(arr.length>best.length)best=arr;if(arr.length===order.length)break}return best}
function solve(iter=4500,seed=2026){let start=performance.now(),rand=rng(seed),cur=(check(baseline).length===0?baseline:generate(seed)).map(x=>({...x}));if(check(cur).length){return {arr:cur,info:{status:"Не найден полный допустимый вариант; это не доказательство несовместности.",ms:Math.round(performance.now()-start),iter:0,seed}}}let val=score(evaluate(cur)),best=cur.slice(),bestVal=val,accepted=0;for(let i=0;i<iter;i++){let j=Math.floor(rand()*cur.length),a=cur[j],opts=options.get(a.id),c=opts[Math.floor(rand()*opts.length)];if(c.slot===a.slot&&c.room===a.room)continue;if(!compatible(c,cur))continue;cur[j]=c;let nv=score(evaluate(cur)),temp=Math.max(.1,5*(1-i/iter));if(nv<=val||rand()<Math.exp((val-nv)/temp)){val=nv;accepted++;if(nv<bestVal){bestVal=nv;best=cur.slice()}}else cur[j]=a}return {arr:best,info:{status:"Найден допустимый вариант; глобальный оптимум не доказан.",ms:Math.round(performance.now()-start),iter,seed,accepted}}}
function init(d){data=validate(d);index();let supplied=Array.isArray(d.baseline);baseline=supplied?d.baseline.map(x=>({id:x.id,slot:x.slot,room:x.room})):generate();result=[];runInfo=null;report=supplied?"Загружено исходное расписание.":"Исходное расписание сгенерировано для сравнения.";filterId="";draft=JSON.stringify({...d,baseline},null,2)}
function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csv(v){let s=String(v??"");if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function exportSchedule(){let a=active();download("kantor-schedule.csv","\ufeff"+[["Неделя","День","Начало","Дисциплина","Группы","Преподаватель","Аудитория","Корпус"],...a.map(x=>{let l=L.get(x.id),r=R.get(x.room);return [week(x.slot)+1,days[day(x.slot)],times[period(x.slot)],l.title,l.groups.map(g=>G.get(g).name||g).join(", "),T.get(l.teacher).name||l.teacher,r.name||r.id,r.building]})].map(row=>row.map(csv).join(";")).join("\r\n"),"text/csv;charset=utf-8")}
function exportChart(){let a=evaluate(baseline),b=result.length?evaluate(result):null;if(!b||check(baseline).length||check(result).length){alert("Для научного графика нужны два полных допустимых расписания.");return}let rows=metrics.slice(0,5).map(([k,n,u],i)=>{let y=100+i*84,max=Math.max(a[k],b[k],1);return '<text x="28" y="'+y+'" font-size="15" font-weight="bold">'+esc(n)+' ('+esc(u)+')</text><rect x="28" y="'+(y+10)+'" width="'+(550*a[k]/max)+'" height="13" fill="#9aafbc"/><rect x="28" y="'+(y+29)+'" width="'+(550*b[k]/max)+'" height="13" fill="#087e78"/><text x="600" y="'+(y+22)+'" font-size="13">'+fmt(a[k])+'</text><text x="600" y="'+(y+42)+'" font-size="13">'+fmt(b[k])+'</text>'}).join("");download("kantor-comparison.svg",'<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570"><rect width="800" height="570" fill="white"/><g font-family="Arial,sans-serif" fill="#172e40"><text x="28" y="35" font-size="24" font-weight="bold">КАНТОР: сравнение расписаний</text><text x="28" y="58" font-size="13">Серый — исходное, зелёный — рассчитанное · '+esc(data.demo?"демонстрационные данные":data.name||"пользовательские данные")+'</text>'+rows+'<text x="28" y="550" font-size="12">Локальный поиск · seed '+esc(runInfo?.seed)+' · итерации '+esc(runInfo?.iter)+' · версия 0.1</text></g></svg>',"image/svg+xml")}
function exportReport(){download("kantor-experiment.json",JSON.stringify({version:"0.1",data:{...data,baseline},weights,baselineMetrics:evaluate(baseline),resultMetrics:result.length?evaluate(result):null,baselineErrors:check(baseline),resultErrors:result.length?check(result):null,result,runInfo},null,2),"application/json")}
const fmt=n=>Number(n.toFixed(2)).toLocaleString("ru-RU"), active=()=>view==="baseline"||!result.length?baseline:result;
const tabs=[["overview","Обзор"],["schedule","Расписание"],["optimize","Оптимизация"],["checks","Контроль"],["data","Исходные данные"],["method","Методология"]];
function render(){ $("notice").innerHTML=data.demo?"<b>Демонстрационные данные.</b> Названия групп, преподаватели, аудитории и время переходов условные. Это не расписание академии.":"<b>Пользовательский набор:</b> "+esc(data.name||"Без названия")+". Источник и точность данных требуют проверки."; $("nav").innerHTML=tabs.map(([id,n])=>'<button data-tab="'+id+'" class="'+(tab===id?"active":"")+'">'+n+'</button>').join("");let body="";
if(tab==="overview"){let a=evaluate(baseline),b=result.length?evaluate(result):null;body='<section class="panel"><div class="row between"><div><h2>Панель исследования</h2><p class="muted">Двухнедельный цикл · 5 дней · 5 учебных интервалов в день</p></div><button class="primary" id="go">Настроить оптимизацию</button></div><div class="grid">'+[["Учебные группы",data.groups.length],["Преподаватели",data.teachers.length],["Аудитории",data.rooms.length],["Занятия по плану",data.lessons.length]].map(([k,v])=>'<div class="metric"><small>'+k+'</small><strong>'+v+'</strong></div>').join("")+'</div></section><section class="panel"><h2>Сравнение вариантов</h2><p class="muted">Серый — исходное, зелёный — рассчитанное. Меньше — лучше; сравнивать только при полном и допустимом расписании.</p><div class="grid"><div class="metric"><small>Исходная целевая функция</small><strong>'+fmt(score(a))+'</strong></div><div class="metric"><small>Рассчитанная целевая функция</small><strong>'+(b?fmt(score(b)):"—")+'</strong></div><div class="metric"><small>Изменение оценки</small><strong>'+(b&&check(baseline).length===0&&check(result).length===0&&score(a)>0?fmt(100*(score(b)/score(a)-1))+"%":"—")+'</strong></div></div><p>'+(b?esc(runInfo.status):"Запустите расчёт, чтобы получить второй вариант.")+'</p>'+metrics.map(([k,n,u])=>{let max=Math.max(a[k],b?.[k]||0,1);return '<div class="chartrow"><div class="row between"><b>'+n+'</b><span>'+fmt(a[k])+' → '+(b?fmt(b[k]):"—")+' '+u+'</span></div><div class="bar"><i style="width:'+100*a[k]/max+'%"></i></div>'+(b?'<div class="bar new"><i style="width:'+100*b[k]/max+'%"></i></div>':"")+'</div>'}).join("")+'<div class="row"><button id="exportReport">Экспорт эксперимента JSON</button><button id="exportChart" '+(b?"":"disabled")+'>График SVG для статьи</button></div></section>'}
if(tab==="schedule"){let a=active(), list=filterType==="group"?data.groups:filterType==="teacher"?data.teachers:data.rooms;let opts=list.map(x=>'<option value="'+esc(x.id)+'" '+(filterId===x.id?"selected":"")+'>'+esc(x.name||x.id)+'</option>').join("");let match=x=>!filterId||(filterType==="group"?L.get(x.id).groups.includes(filterId):filterType==="teacher"?L.get(x.id).teacher===filterId:x.room===filterId);body='<section class="panel"><h2>Расписание занятий</h2><div class="row"><label>Версия<select id="view"><option value="baseline" '+(view==="baseline"?"selected":"")+'>Исходная</option><option value="result" '+(view==="result"?"selected":"")+' '+(!result.length?"disabled":"")+'>Рассчитанная</option></select></label><label>Неделя<select id="week"><option value="0" '+(weekView===0?"selected":"")+'>Первая</option><option value="1" '+(weekView===1?"selected":"")+'>Вторая</option></select></label><label>Ресурс<select id="filterType">'+[["group","Группа"],["teacher","Преподаватель"],["room","Аудитория"]].map(([v,n])=>'<option value="'+v+'" '+(v===filterType?"selected":"")+'>'+n+'</option>').join("")+'</select></label><label>Фильтр<select id="filterId"><option value="">Все</option>'+opts+'</select></label><button id="csv">Экспорт CSV (вся версия)</button></div><p class="muted">Назначено '+a.length+' из '+data.lessons.length+' · '+check(a).length+' замечаний проверки</p><div class="scroll"><table><thead><tr><th>Время</th>'+days.map(d=>'<th>'+d+'</th>').join("")+'</tr></thead><tbody>'+times.map((t,p)=>'<tr><th>'+t+'</th>'+days.map((_,d)=>'<td>'+a.filter(x=>x.slot===slot(weekView,d,p)&&match(x)).map(x=>{let l=L.get(x.id),r=R.get(x.room);return '<div class="lesson"><b>'+esc(l.title||l.id)+'</b><small>'+esc(l.groups.map(g=>G.get(g).name||g).join(", "))+'</small><small>'+esc(T.get(l.teacher).name||l.teacher)+'</small><small>'+esc(r.name||r.id)+' · '+esc(r.building)+'</small></div>'}).join("")+'</td>').join("")+'</tr>').join("")+'</tbody></table></div></section>'}
if(tab==="optimize"){body='<section class="panel"><h2>Управление целевой функцией</h2><p>Установите веса штрафов. Жёсткие ограничения не зависят от весов. Вес 0 исключает критерий из оценки.</p><div class="grid">'+metrics.map(([k,n,u])=>'<label>'+n+' ('+u+')<input type="number" min="0" max="1000" step="0.01" data-weight="'+k+'" value="'+weights[k]+'"></label>').join("")+'</div><p class="muted">Вес изменений полезен при оперативном перепланировании. Метрики имеют разные единицы измерения; веса выражают относительную стоимость штрафов, а не нормативы.</p><div class="row"><label>Итерации<input id="iter" type="number" min="100" max="20000" step="100" value="4500"></label><label>Seed<input id="seed" type="number" value="2026"></label><button class="primary" id="run" '+(busy?"disabled":"")+'>Рассчитать расписание</button></div><p id="status" role="status">'+esc(report)+'</p>'+(runInfo?'<p>'+esc(runInfo.status)+'<br>Время: '+runInfo.ms+' мс · итерации: '+runInfo.iter+' · seed: '+runInfo.seed+'</p>':"")+'</section><section class="panel"><h3>Жёсткие ограничения</h3><p>Учебный план, отсутствие пересечений, тип и вместимость помещения, доступность ресурсов, фиксированные занятия, дневные лимиты, физическая достижимость корпусов.</p></section>'}
if(tab==="checks"){let a=check(baseline),b=result.length?check(result):null;body='<section class="panel"><h2>Проверка допустимости</h2>'+[["Исходное",a],["Рассчитанное",b]].map(([n,e])=>'<h3>'+n+'</h3><p class="'+(e&&e.length?"bad":"good")+'">'+(e?(e.length?e.length+" замечаний":"Все реализованные ограничения соблюдены"):"Расчёт ещё не выполнен")+'</p>'+(e&&e.length?'<details><summary>Показать замечания</summary><ul>'+e.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></details>':"")).join("")+'<p class="muted">Проверка выполняется отдельно от целевой функции, но использует те же определения ограничений. Не является внешней независимой сертификацией.</p></section><section class="panel"><h2>Аудиторный фонд</h2><div class="scroll"><table><tr><th>Аудитория</th><th>Корпус</th><th>Мест</th><th>Назначено / 50 интервалов</th></tr>'+data.rooms.map(r=>'<tr><td>'+esc(r.name||r.id)+'</td><td>'+esc(r.building)+'</td><td>'+r.capacity+'</td><td>'+active().filter(x=>x.room===r.id).length+' / 50</td></tr>').join("")+'</table></div></section>'}
if(tab==="data"){body="<section class=\"panel\"><h2>Пилот: Институт экономики и управления АПК</h2><p>Официальные расписания 1–5 курсов, первый семестр 2026/2027. Источники найдены; полная оцифровка ещё не выполнена. Расчёты версии 0.1 по-прежнему демонстрационные.</p><div class=\"scroll\"><table><tr><th>Курс</th><th>Страниц</th><th>Источник</th></tr><tr><td>1 курс</td><td>4</td><td><a href=\"https://www.timacad.ru/uploads/files/20261016/1792149829_ieiu-1.pdf\" target=\"_blank\" rel=\"noopener\">Официальное расписание PDF</a></td></tr><tr><td>2 курс</td><td>4</td><td><a href=\"https://www.timacad.ru/uploads/files/20261016/1792149840_ieiu-2.pdf\" target=\"_blank\" rel=\"noopener\">Официальное расписание PDF</a></td></tr><tr><td>3 курс</td><td>4</td><td><a href=\"https://www.timacad.ru/uploads/files/20261027/1793083289_ieiu-3.pdf\" target=\"_blank\" rel=\"noopener\">Официальное расписание PDF</a></td></tr><tr><td>4 курс</td><td>3</td><td><a href=\"https://www.timacad.ru/uploads/files/20261016/1792149864_ieiu-4.pdf\" target=\"_blank\" rel=\"noopener\">Официальное расписание PDF</a></td></tr><tr><td>5 курс</td><td>1</td><td><a href=\"https://www.timacad.ru/uploads/files/20261016/1792149886_ieiu-5.pdf\" target=\"_blank\" rel=\"noopener\">Официальное расписание PDF</a></td></tr></table></div><p><a href=\"sources-2026.json\">Реестр источников JSON</a> · <a href=\"https://www.timacad.ru/about/sveden/document/rezhim-zaniatii-obuchaiushchikhsia\" target=\"_blank\" rel=\"noopener\">Официальный раздел академии</a></p></section>"+'<section class="panel"><h2>Импорт и справочники</h2><p>Загрузите JSON по демонстрационному шаблону либо отредактируйте его ниже. Идентификаторы должны быть уникальными; интервалы 0–24 — первая неделя, 25–49 — вторая. Типы помещений и занятий должны совпадать.</p><div class="row"><input id="upload" type="file" accept=".json,application/json"><button id="template">Скачать текущие данные</button><button id="reset">Вернуть демо</button></div><textarea id="json" spellcheck="false" aria-label="Исходные данные">'+esc(draft)+'</textarea><div class="row"><button class="primary" id="apply">Применить JSON</button><span id="dataStatus" role="status"></span></div></section><section class="panel"><h3>Состав модели</h3><div class="scroll"><table><tr><th>Сущность</th><th>Поля</th></tr><tr><td>groups</td><td>id, name, size, unavailable (необязательно)</td></tr><tr><td>teachers</td><td>id, name, unavailable</td></tr><tr><td>rooms</td><td>id, name, building, capacity, type, unavailable</td></tr><tr><td>lessons</td><td>id, title, groups[], teacher, week (0/1), type, fixed (slot, room; необязательно)</td></tr><tr><td>travel</td><td>Ключ «Корпус А|Корпус Б», минут между корпусами</td></tr><tr><td>baseline</td><td>Массив {id, slot, room}, одно назначение на занятие</td></tr></table></div></section>'}
if(tab==="method"){body='<section class="panel"><h2>Научная методология</h2><p>Задача дискретного распределения ограниченных ресурсов в традиции Л. В. Канторовича. Каждому занятию назначается одна допустимая пара (время, аудитория). Цели устанавливаются человеком.</p><h3>Целевая функция</h3><p>F = w₁Wₛ + w₂Wₜ + w₃M + w₄B + w₅R + w₆C → min.</p><div class="scroll"><table><tr><th>Показатель</th><th>Формула и интерпретация</th></tr><tr><td>Wₛ, Wₜ</td><td>По каждому ресурсу и дню: последний номер пары − первый + 1 − число занятий. Сумма по группам и преподавателям.</td></tr><tr><td>M</td><td>Сумма минут переходов между последовательными занятиями каждого преподавателя и группы. Это ресурсо-минуты, а не человеко-минуты.</td></tr><tr><td>B</td><td>Сумма n(n−1)/2 по дням и группам. Штраф за концентрацию занятий; не измеряет реальную утомляемость.</td></tr><tr><td>R</td><td>Сумма вместимости назначенной аудитории минус суммарная численность групп. Не показатель простоя помещения.</td></tr><tr><td>C</td><td>Число занятий, изменивших слот или аудиторию относительно исходного.</td></tr></table></div><h3 style="margin-top:20px">Алгоритм версии 0.1</h3><p>Генерация допустимых назначений, жадное построение начального решения с повторными попытками, затем стохастический локальный поиск с имитацией отжига и сохранением лучшего допустимого решения. Seed и число итераций фиксируются для воспроизводимости.</p><p><b>Ограничения метода:</b> глобальный оптимум и нижняя граница не доказаны; отсутствие решения не означает несовместность условий. Нет интеграции с информационной системой академии, нормативы и временная сетка демонстрационные. Следующая исследовательская версия — CP-SAT, сравнение алгоритмов и расчёт границы оптимальности.</p><h3>Научная основа</h3><p>Канторович Л. В. Математические методы организации и планирования производства. 1939.</p><p>Шилин О. А. Использование современных цифровых средств как инструмента организации образовательного процесса // Вопросы студенческой науки. 2025. № 4 (104). С. 140–144. Критерии требований к расписанию, с. 141; сравнение программ, с. 142–143; роль методиста, с. 144.</p><p>Критерии из статьи адаптированы: сложность дисциплин, индивидуальные учебные планы и психофизиологические особенности пока не реализованы.</p></section>'}
$("screen").innerHTML=body;bind()}
function on(id,event,fn){let e=$(id);if(e)e.addEventListener(event,fn)}
function bind(){document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});on("go","click",()=>{tab="optimize";render()});on("view","change",e=>{view=e.target.value;render()});on("week","change",e=>{weekView=+e.target.value;render()});on("filterType","change",e=>{filterType=e.target.value;filterId="";render()});on("filterId","change",e=>{filterId=e.target.value;render()});on("csv","click",exportSchedule);on("exportReport","click",exportReport);on("exportChart","click",exportChart);document.querySelectorAll("[data-weight]").forEach(x=>x.onchange=()=>{let n=Number(x.value);weights[x.dataset.weight]=Number.isFinite(n)?Math.max(0,Math.min(1000,n)):0;x.value=weights[x.dataset.weight];result=[];runInfo=null;report="Веса изменены. Запустите новый расчёт.";if($("status"))$("status").textContent=report});on("run","click",()=>{if(busy)return;let iter=Math.max(100,Math.min(20000,Math.trunc(+$("iter").value||4500))),seed=Math.trunc(+$("seed").value||2026);busy=true;$("run").disabled=true;$("status").textContent="Выполняется расчёт…";setTimeout(()=>{try{let r=solve(iter,seed);result=r.arr;runInfo=r.info;view="result";report=r.info.status;tab="overview"}catch(e){report=e.message}finally{busy=false;render()}},30)});on("json","input",e=>{draft=e.target.value});on("upload","change",async e=>{let f=e.target.files[0];if(f){draft=await f.text();$("json").value=draft}});on("apply","click",()=>{try{let d=validate(JSON.parse($("json").value));init(d);render();$("dataStatus").textContent="Данные приняты."}catch(e){$("dataStatus").textContent=e.message}});on("template","click",()=>download("kantor-data.json",JSON.stringify({...data,baseline},null,2),"application/json"));on("reset","click",()=>{init(demo());render()})}
init(demo());render();
